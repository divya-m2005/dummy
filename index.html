
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body>

    <h2 class="login-heading">Login</h2>

    <form class="login-form" action="/login" method="post">
        <label class="label-username">Username:</label><br>
        <input class="input-username" type="text" name="username" required><br><br>

        <label class="label-password">Password:</label><br>
        <input class="input-password" type="password" name="password" required><br><br>

        <button class="btn-login" type="submit">Login</button>
    </form>

</body>
</html>
